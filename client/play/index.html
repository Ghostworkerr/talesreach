<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1611" />
    <meta name="description" content="Talesreach — a free browser MMORPG for phone and PC. Live a life in a medieval fantasy world." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Talesreach — Play</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1611; overflow: hidden; touch-action: none; }
      #game { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; color: #f3e6c8; }
      #status { position: absolute; left: 12px; bottom: 12px; font-size: 14px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"><div id="status">Starting…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
